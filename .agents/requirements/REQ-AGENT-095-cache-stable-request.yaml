id: REQ-AGENT-095
title: Naia GPT-5.6 cache-stable request sharding
title_ko: Naia GPT-5.6 캐시 안정 요청
product: naia-agent
module: provider-adapter
status: verified
source: issue
priority: high
created: 2026-07-31
updated: 2026-07-31
issue_url: https://github.com/nextain/naia-agent/issues/95

description: |
  For Naia-account GPT-5.6 chat traffic, send a deterministic non-secret cache
  shard derived from model and stable system prefix. The AnyLLM gateway combines
  it with authenticated user identity. Pi remains limited to the already agreed
  Grok/DeepSeek standalone model set and receives a safe gateway fallback key.

acceptance_criteria:
  - Same Naia GPT-5.6 model and exact UTF-8 system-prefix bytes produce the same prompt_cache_key; no whitespace or Unicode normalization may merge prefixes that Azure would treat as different.
  - A different model or system prefix produces a different key.
  - Native and unrelated Naia models receive no cache-specific request field.
  - Existing CLI, Pi, Shell and canonical provider/model contracts remain unchanged.
  - Pi's standalone allowlist remains exactly Grok 4.3 and DeepSeek V4 Pro; contract tests assert neither receives a GPT-5.6 cache field or model-list expansion.
  - Gateway integration demonstrates write-then-read usage without exposing account or workspace identifiers.

